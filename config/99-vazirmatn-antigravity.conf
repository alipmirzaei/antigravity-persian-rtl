<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Match Persian and Arabic language explicitly -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>fa</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Vazirmatn</string>
    </edit>
  </match>

  <!-- Fallback order for sans-serif: Latin first, then Vazirmatn for Persian -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Vazirmatn</family>
    </prefer>
  </alias>

  <!-- Fallback order for system-ui -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Vazirmatn</family>
    </prefer>
  </alias>

  <!-- Fallback order for serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Vazirmatn</family>
    </prefer>
  </alias>

  <!-- Fallback order for monospace (e.g. code blocks, Persian comments) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Ubuntu Sans Mono</family>
      <family>Ubuntu Mono</family>
      <family>Vazirmatn</family>
    </prefer>
  </alias>
</fontconfig>
